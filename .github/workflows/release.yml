name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      hash: ${{ steps.version.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Generate version
        id: version
        run: |
          # Use MajorMinorPatch for a clean v1.0.x tag
          VERSION="${{ steps.gitversion.outputs.majorMinorPatch }}"
          # Get the shortened commit hash reliably
          HASH=$(git rev-parse --short=7 HEAD)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          # Get the previous tag if it exists
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          # Generate release notes
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "## Changes since $PREVIOUS_TAG" > release_notes.md
            echo "" >> release_notes.md
            git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %s (%an)" >> release_notes.md
          else
            echo "## Initial Release" > release_notes.md
            echo "" >> release_notes.md
            echo "First automated release of StripWolf." >> release_notes.md
            echo "" >> release_notes.md
            echo "### Features" >> release_notes.md
            echo "- Cross-platform comic book reader" >> release_notes.md
            echo "- Support for CBZ, CBR, and PDF formats" >> release_notes.md
            echo "- Komga server integration" >> release_notes.md
            echo "- Offline reading support" >> release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}-g${{ steps.version.outputs.hash }}
          body_path: release_notes.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/StripWolf/StripWolf.Desktop/StripWolf.Desktop.csproj

      - name: Build Windows Release
        run: dotnet publish src/StripWolf/StripWolf.Desktop/StripWolf.Desktop.csproj -c Release -r win-x64 --self-contained -o publish/windows -p:DebugType=none -p:DebugSymbols=false -p:AllowedReferenceRelatedFileExtensions=none

      - name: Create Windows ZIP
        run: Compress-Archive -Path publish/windows/* -DestinationPath StripWolf-Windows-x64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: StripWolf-Windows-x64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/StripWolf/StripWolf.Desktop/StripWolf.Desktop.csproj

      - name: Build Linux Release
        run: dotnet publish src/StripWolf/StripWolf.Desktop/StripWolf.Desktop.csproj -c Release -r linux-x64 --self-contained -o publish/linux -p:DebugType=none -p:DebugSymbols=false -p:AllowedReferenceRelatedFileExtensions=none

      - name: Create Linux tarball
        run: tar -czvf StripWolf-Linux-x64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.tar.gz -C publish/linux .

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: StripWolf-Linux-x64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.tar.gz
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/StripWolf/StripWolf.Desktop/StripWolf.Desktop.csproj

      - name: Build macOS x64 Release
        run: |
          dotnet publish src/StripWolf/StripWolf.Desktop/StripWolf.Desktop.csproj -c Release -r osx-x64 --self-contained -o publish/macos-x64/StripWolf.app/Contents/MacOS -p:DebugType=none -p:DebugSymbols=false -p:AllowedReferenceRelatedFileExtensions=none
          mkdir -p publish/macos-x64/StripWolf.app/Contents
          cat << 'EOF' > publish/macos-x64/StripWolf.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>StripWolf</string>
              <key>CFBundleIdentifier</key>
              <string>net.dapplo.stripwolf</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>StripWolf</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ needs.prepare.outputs.version }}</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>${{ needs.prepare.outputs.version }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.12</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          find publish/macos-x64/StripWolf.app -name "*.dylib" -exec codesign --force -s - {} \;
          codesign --force -s - publish/macos-x64/StripWolf.app/Contents/MacOS/StripWolf
          codesign --force -s - publish/macos-x64/StripWolf.app

      - name: Build macOS ARM64 Release
        run: |
          dotnet publish src/StripWolf/StripWolf.Desktop/StripWolf.Desktop.csproj -c Release -r osx-arm64 --self-contained -o publish/macos-arm64/StripWolf.app/Contents/MacOS -p:DebugType=none -p:DebugSymbols=false -p:AllowedReferenceRelatedFileExtensions=none
          mkdir -p publish/macos-arm64/StripWolf.app/Contents
          cat << 'EOF' > publish/macos-arm64/StripWolf.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>StripWolf</string>
              <key>CFBundleIdentifier</key>
              <string>net.dapplo.stripwolf</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>StripWolf</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ needs.prepare.outputs.version }}</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>${{ needs.prepare.outputs.version }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.12</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          find publish/macos-arm64/StripWolf.app -name "*.dylib" -exec codesign --force -s - {} \;
          codesign --force -s - publish/macos-arm64/StripWolf.app/Contents/MacOS/StripWolf
          codesign --force -s - publish/macos-arm64/StripWolf.app

      - name: Create macOS x64 tarball
        run: tar -czvf StripWolf-macOS-x64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.tar.gz -C publish/macos-x64 StripWolf.app

      - name: Create macOS ARM64 tarball
        run: tar -czvf StripWolf-macOS-arm64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.tar.gz -C publish/macos-arm64 StripWolf.app

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: |
            StripWolf-macOS-x64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.tar.gz
            StripWolf-macOS-arm64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.tar.gz
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore dependencies
        run: dotnet restore src/StripWolf/StripWolf.Android/StripWolf.Android.csproj

      - name: Setup signing keystore
        run: |
          # Create keystore for signing the APK
          # For production/store releases, use secrets to store the keystore
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src/StripWolf/StripWolf.Android/StripWolf.keystore
          else
            # Generate a new keystore for CI builds (suitable for sideloading)
            keytool -genkeypair -v \
              -keystore src/StripWolf/StripWolf.Android/StripWolf.keystore \
              -alias StripWolf \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=StripWolf, OU=Development, O=Dapplo, L=Unknown, ST=Unknown, C=NL"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Android ARM64 APK
        run: |
          dotnet publish src/StripWolf/StripWolf.Android/StripWolf.Android.csproj -c Release -r android-arm64 -o publish/android-arm64 \
            -p:DebugType=none -p:DebugSymbols=false -p:AllowedReferenceRelatedFileExtensions=none \
            -p:RuntimeIdentifier=android-arm64 \
            -p:GitVersion_CommitsSinceVersionSource="$GitVersion_CommitsSinceVersionSource" \
            -p:GitVersion_SemVer="$GitVersion_SemVer"
        env:
          ANDROID_SIGNING_KEY_PASS: ${{ secrets.ANDROID_SIGNING_KEY_PASS || 'android' }}
          ANDROID_SIGNING_STORE_PASS: ${{ secrets.ANDROID_SIGNING_STORE_PASS || 'android' }}

      - name: Build Android x64 APK
        run: |
          dotnet publish src/StripWolf/StripWolf.Android/StripWolf.Android.csproj -c Release -r android-x64 -o publish/android-x64 \
            -p:DebugType=none -p:DebugSymbols=false -p:AllowedReferenceRelatedFileExtensions=none \
            -p:RuntimeIdentifier=android-x64 \
            -p:GitVersion_CommitsSinceVersionSource="$GitVersion_CommitsSinceVersionSource" \
            -p:GitVersion_SemVer="$GitVersion_SemVer"
        env:
          ANDROID_SIGNING_KEY_PASS: ${{ secrets.ANDROID_SIGNING_KEY_PASS || 'android' }}
          ANDROID_SIGNING_STORE_PASS: ${{ secrets.ANDROID_SIGNING_STORE_PASS || 'android' }}

      - name: Build Android App Bundle (AAB)
        run: |
          dotnet publish src/StripWolf/StripWolf.Android/StripWolf.Android.csproj -c Release -o publish/android-aab \
            -p:DebugType=none -p:DebugSymbols=false -p:AllowedReferenceRelatedFileExtensions=none \
            -p:AndroidPackageFormat=aab \
            -p:AndroidCreatePackagePerAbi=false \
            -p:IsPlayStoreBuild=true \
            -p:RuntimeIdentifiers='"android-arm64;android-x64"' \
            -p:GitVersion_CommitsSinceVersionSource="$GitVersion_CommitsSinceVersionSource" \
            -p:GitVersion_SemVer="$GitVersion_SemVer"
        env:
          ANDROID_SIGNING_KEY_PASS: ${{ secrets.ANDROID_SIGNING_KEY_PASS || 'android' }}
          ANDROID_SIGNING_STORE_PASS: ${{ secrets.ANDROID_SIGNING_STORE_PASS || 'android' }}

      - name: Find and rename Android Artifacts
        run: |
          mkdir -p release-artifacts
          
          # Process ARM64 APK
          APK_ARM=$(find publish/android-arm64 -name "*-Signed.apk" | head -1)
          if [ -n "$APK_ARM" ]; then
            cp "$APK_ARM" "release-artifacts/StripWolf-Android-arm64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.apk"
          fi

          # Process x64 APK
          APK_X64=$(find publish/android-x64 -name "*-Signed.apk" | head -1)
          if [ -n "$APK_X64" ]; then
            cp "$APK_X64" "release-artifacts/StripWolf-Android-x86_64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.apk"
          fi

          # Process AAB
          AAB_FILE=$(find publish/android-aab -name "*-Signed.aab" | head -1)
          if [ -n "$AAB_FILE" ]; then
            cp "$AAB_FILE" "release-artifacts/StripWolf-Android-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.aab"
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        if: ${{ env.PLAY_SERVICE_ACCOUNT_KEY != '' }}
        env:
          PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_KEY }}
          packageName: com.dapplo.StripWolf
          releaseFiles: release-artifacts/*.aab
          track: internal
          status: completed
