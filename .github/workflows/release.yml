name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      hash: ${{ steps.version.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Generate version
        id: version
        run: |
          # Use MajorMinorPatch for a clean v1.0.x tag
          VERSION="${{ steps.gitversion.outputs.majorMinorPatch }}"
          # Get the shortened commit hash reliably
          HASH=$(git rev-parse --short=7 HEAD)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          # Get the previous tag if it exists
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          # Generate release notes
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "## Changes since $PREVIOUS_TAG" > release_notes.md
            echo "" >> release_notes.md
            git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %s (%an)" >> release_notes.md
          else
            echo "## Initial Release" > release_notes.md
            echo "" >> release_notes.md
            echo "First automated release of StripWolf." >> release_notes.md
            echo "" >> release_notes.md
            echo "### Features" >> release_notes.md
            echo "- Cross-platform comic book reader" >> release_notes.md
            echo "- Support for CBZ, CBR, and PDF formats" >> release_notes.md
            echo "- Komga server integration" >> release_notes.md
            echo "- Offline reading support" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Downloads" >> release_notes.md
          echo "- **Windows**: StripWolf-Windows-x64.zip" >> release_notes.md
          echo "- **Linux**: StripWolf-Linux-x64.tar.gz" >> release_notes.md
          echo "- **macOS (Intel)**: StripWolf-macOS-x64.tar.gz" >> release_notes.md
          echo "- **macOS (Apple Silicon)**: StripWolf-macOS-arm64.tar.gz" >> release_notes.md
          echo "- **Android**: StripWolf-Android.apk" >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}-g${{ needs.prepare.outputs.hash }}
          body_path: release_notes.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/StripWolf/StripWolf.Desktop/StripWolf.Desktop.csproj

      - name: Build Windows Release
        run: dotnet publish src/StripWolf/StripWolf.Desktop/StripWolf.Desktop.csproj -c Release -r win-x64 --self-contained -o publish/windows -p:DebugType=none -p:DebugSymbols=false -p:AllowedReferenceRelatedFileExtensions=none

      - name: Create Windows ZIP
        run: Compress-Archive -Path publish/windows/* -DestinationPath StripWolf-Windows-x64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: StripWolf-Windows-x64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/StripWolf/StripWolf.Desktop/StripWolf.Desktop.csproj

      - name: Build Linux Release
        run: dotnet publish src/StripWolf/StripWolf.Desktop/StripWolf.Desktop.csproj -c Release -r linux-x64 --self-contained -o publish/linux -p:DebugType=none -p:DebugSymbols=false -p:AllowedReferenceRelatedFileExtensions=none

      - name: Create Linux tarball
        run: tar -czvf StripWolf-Linux-x64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.tar.gz -C publish/linux .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: StripWolf-Linux-x64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/StripWolf/StripWolf.Desktop/StripWolf.Desktop.csproj

      - name: Build macOS x64 Release
        run: dotnet publish src/StripWolf/StripWolf.Desktop/StripWolf.Desktop.csproj -c Release -r osx-x64 --self-contained -o publish/macos-x64 -p:DebugType=none -p:DebugSymbols=false -p:AllowedReferenceRelatedFileExtensions=none

      - name: Build macOS ARM64 Release
        run: dotnet publish src/StripWolf/StripWolf.Desktop/StripWolf.Desktop.csproj -c Release -r osx-arm64 --self-contained -o publish/macos-arm64 -p:DebugType=none -p:DebugSymbols=false -p:AllowedReferenceRelatedFileExtensions=none

      - name: Create macOS x64 tarball
        run: tar -czvf StripWolf-macOS-x64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.tar.gz -C publish/macos-x64 .

      - name: Create macOS ARM64 tarball
        run: tar -czvf StripWolf-macOS-arm64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.tar.gz -C publish/macos-arm64 .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: |
            StripWolf-macOS-x64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.tar.gz
            StripWolf-macOS-arm64-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore dependencies
        run: dotnet restore src/StripWolf/StripWolf.Android/StripWolf.Android.csproj

      - name: Setup signing keystore
        run: |
          # Create keystore for signing the APK
          # For production/store releases, use secrets to store the keystore
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src/StripWolf/StripWolf.Android/StripWolf.keystore
          else
            # Generate a new keystore for CI builds (suitable for sideloading)
            keytool -genkeypair -v \
              -keystore src/StripWolf/StripWolf.Android/StripWolf.keystore \
              -alias StripWolf \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=StripWolf, OU=Development, O=Dapplo, L=Unknown, ST=Unknown, C=NL"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Android APK
        run: dotnet publish src/StripWolf/StripWolf.Android/StripWolf.Android.csproj -c Release -o publish/android -p:DebugType=none -p:DebugSymbols=false -p:AllowedReferenceRelatedFileExtensions=none
        env:
          ANDROID_SIGNING_KEY_PASS: ${{ secrets.ANDROID_SIGNING_KEY_PASS || 'android' }}
          ANDROID_SIGNING_STORE_PASS: ${{ secrets.ANDROID_SIGNING_STORE_PASS || 'android' }}

      - name: Find and rename APK
        run: |
          APK_PATH=$(find publish/android -name "*-Signed.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find publish/android -name "*.apk" | head -1)
          fi
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" StripWolf-Android-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.apk
          else
            echo "APK not found in publish output, checking signed APK location..."
            APK_PATH=$(find . -path "*/bin/Release/*/publish/*-Signed.apk" | head -1)
            if [ -z "$APK_PATH" ]; then
              APK_PATH=$(find . -path "*/bin/Release/*/publish/*.apk" | head -1)
            fi
            if [ -n "$APK_PATH" ]; then
              cp "$APK_PATH" StripWolf-Android-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.apk
            else
              echo "Error: Could not find APK file"
              find . -name "*.apk" 2>/dev/null || true
              exit 1
            fi
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: StripWolf-Android-${{ needs.prepare.outputs.version }}-g${{ needs.prepare.outputs.hash }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
