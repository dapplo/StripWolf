name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # GitVersion.MsBuild (referenced by StripWolf.Core) needs the full history
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/StripWolf/StripWolf.Core.Tests/StripWolf.Core.Tests.csproj

      - name: Test
        # The LocalComics tests need the developer's own comics (STRIPWOLF_TEST_COMICS) and are excluded here
        run: dotnet test src/StripWolf/StripWolf.Core.Tests/StripWolf.Core.Tests.csproj -c Release --no-restore --filter "Category!=LocalComics" --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
