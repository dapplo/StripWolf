name: Cleanup old workflow runs

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 03:00 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs older than 30 days
        uses: actions/github-script@v7
        with:
          script: |
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - 30);
            const MAX_PAGES = 50; // safety cap to avoid runaway execution

            let totalDeleted = 0;
            let page = 1;

            // Runs are returned newest-first, so we page through all pages looking for
            // old runs to delete. Recent runs (within the retention window) are skipped.
            while (page <= MAX_PAGES) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });

              if (data.workflow_runs.length === 0) break;

              for (const run of data.workflow_runs) {
                if (new Date(run.created_at) >= cutoffDate) {
                  continue; // still within retention window, keep it
                }
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                  console.log(`Deleted run #${run.id} (${run.name}) created at ${run.created_at}`);
                  totalDeleted++;
                } catch (err) {
                  console.warn(`Failed to delete run #${run.id}: ${err.message}`);
                }
              }

              page++;
            }

            if (page > MAX_PAGES) {
              console.warn(`Reached page limit (${MAX_PAGES}). Re-run the workflow to continue cleanup.`);
            }

            console.log(`Total deleted: ${totalDeleted} workflow run(s).`);
